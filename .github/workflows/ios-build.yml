name: iOS Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: true
        type: string
      ios_path:
        description: 'Path to iOS project (e.g., "ios" for React Native)'
        required: false
        type: string
        default: 'ios'
      scheme:
        description: 'Xcode scheme to build (auto-detected if empty)'
        required: false
        type: string
        default: ''
      use_signing:
        description: 'Enable code signing (requires secrets to be configured)'
        required: false
        type: boolean
        default: false
      configuration:
        description: 'Build configuration (Debug is faster, Release for production)'
        required: false
        type: string
        default: 'Debug'
      flutter_version:
        description: 'Flutter version to use (e.g., 3.24.0). Empty means latest stable.'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore DerivedData cache
        uses: actions/cache/restore@v4
        id: cache-deriveddata
        with:
          path: DerivedData
          key: deriveddata-${{ github.run_id }}
          restore-keys: |
            deriveddata-

      - name: Detect project type
        id: detect
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "type=flutter" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ] && grep -q '"expo"' package.json; then
            echo "type=expo" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ] && grep -q '"react-native"' package.json; then
            echo "type=reactnative" >> $GITHUB_OUTPUT
          else
            echo "type=native" >> $GITHUB_OUTPUT
          fi

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '' }}
          channel: ${{ inputs.flutter_version && 'stable' || 'stable' }}
          cache: true

      - name: Flutter pub get
        if: steps.detect.outputs.type == 'flutter'
        run: flutter pub get

      # NOTE: iOS Widget Extension is disabled in CI for now.
      # flutter build ios manages the Xcode project internally and adding
      # extra native targets via script causes "Multiple commands produce .appex"
      # conflicts. The widget will be configured when building from Xcode on a Mac.
      # - name: Configure iOS Widget Target
      #   if: steps.detect.outputs.type == 'flutter'
      #   run: |
      #     gem install xcodeproj --no-document
      #     ruby ios/add_widget_extension.rb

      - name: Setup Node.js
        if: steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        if: steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo'
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install npm dependencies
        if: (steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo') && steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Restore Pods cache
        uses: actions/cache@v4
        id: pods-cache
        with:
          path: |
            ${{ inputs.ios_path }}/Pods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles(format('{0}/Podfile.lock', inputs.ios_path)) }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Build Flutter iOS (Generates Xcode project)
        if: steps.detect.outputs.type == 'flutter'
        run: |
          if [ "${{ inputs.configuration }}" = "Debug" ]; then
            flutter build ios --debug --no-codesign
          else
            flutter build ios --release --no-codesign
          fi

      - name: Build iOS using build-ios-action
        if: inputs.use_signing
        uses: yukiarrr/ios-build-action@v1.13.0
        with:
          project-path: ${{ inputs.ios_path }}/Runner.xcodeproj
          workspace-path: ${{ inputs.ios_path }}/Runner.xcworkspace
          scheme: ${{ inputs.scheme || 'Runner' }}
          configuration: ${{ inputs.configuration }}
          p12-base64: ${{ secrets.IOS_CERTIFICATE }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          mobileprovision-base64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          code-signing-identity: "Apple Development"
          team-id: ${{ secrets.TEAM_ID }}

      - name: Build Unsigned IPA (Fallback)
        if: ${{ !inputs.use_signing }}
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -rq output.ipa Payload
          rm -rf Payload
          echo "Created unsigned IPA: output.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: output.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Build summary
        if: always()
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration:** $CONFIGURATION" >> $GITHUB_STEP_SUMMARY
          if [ -f output.ipa ]; then
            echo "- **IPA Size:** $(ls -lh output.ipa | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          fi
