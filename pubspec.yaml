name: vivoweb_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.2
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  tmdb_api: ^2.2.3
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.19.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  http: ^1.2.1
  go_router: ^17.2.0
  cached_network_image: ^3.4.1
  google_fonts: ^8.0.2
  intl: ^0.20.2
  lottie: ^3.3.3
  shared_preferences: ^2.5.5
  font_awesome_flutter: ^11.0.0
  flutter_spinkit: ^5.2.2
  wakelock_plus: ^1.2.8
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  package_info_plus: ^8.1.3
  dio: ^5.7.0
  open_file: ^3.5.10
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

dependency_overrides:
  # Forzamos la versión estable anterior para evitar el desastre de JNI en Android
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_background.webp
    - assets/images/avatars/
    - assets/images/info-help-btn.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_background.webp"
  adaptive_icon_background: "#0b122b"
  adaptive_icon_foreground: "assets/images/app_background.webp"